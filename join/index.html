<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join a plan on Social Battery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #0b1226 0%, #14213d 100%);
            color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 420px;
            text-align: center;
        }
        .icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
            display: block;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px;
        }
        p {
            font-size: 16px;
            color: #b8c0d4;
            line-height: 1.5;
            margin: 0 0 32px;
        }
        .btn {
            display: inline-block;
            background: #30eb8c;
            color: #0b1226;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 999px;
        }
        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #6b7591;
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <rect x="60" y="190" width="600" height="460" rx="160" fill="none" stroke="#30eb8c" stroke-width="34"/>
            <polygon points="90,610 220,610 30,835" fill="#30eb8c"/>
            <rect x="628" y="415" width="56" height="150" rx="22" fill="#30eb8c"/>
            <polygon points="542,300 442,470 507,470 477,660 577,460 512,460" fill="#30eb8c"/>
        </svg>
        <h1>You've been invited to a plan</h1>
        <p>Someone wants to check in with you on Social Battery — an anonymous way for friends to confirm plans without the awkward cancel.</p>
        <a class="btn" href="https://testflight.apple.com/join/SjZXszJv" id="appStoreLink">Get the App (TestFlight Beta)</a>
        <p class="note">Already have the app? Just tap the link again — it'll open automatically.</p>
    </div>
</body>
</html>
